name: network
on:
  workflow_dispatch:

jobs:
  https:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - name: Enforce HTTPS
        shell: pwsh
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:CF_API_TOKEN" }
          $zones = Invoke-RestMethod -Uri 'https://api.cloudflare.com/client/v4/zones?per_page=50&status=active' -Headers $headers
          $domain = $env:CF_DOMAIN.Trim().ToLowerInvariant()
          $zone = $zones.result | Where-Object { $domain -eq $_.name -or $domain.EndsWith('.' + $_.name) } | Sort-Object { $_.name.Length } -Descending | Select-Object -First 1
          if (-not $zone) { throw 'No matching Cloudflare zone is visible to this token.' }
          $uri = "https://api.cloudflare.com/client/v4/zones/$($zone.id)/settings/always_use_https"
          $current = Invoke-RestMethod -Uri $uri -Headers $headers
          Write-Host "Zone: $($zone.name); Always Use HTTPS before: $($current.result.value)"
          if ($current.result.value -ne 'on') {
            $body = @{ value = 'on' } | ConvertTo-Json -Compress
            $changed = Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -ContentType 'application/json' -Body $body
            Write-Host "Always Use HTTPS after: $($changed.result.value)"
          }
          $verified = Invoke-RestMethod -Uri $uri -Headers $headers
          if ($verified.result.value -ne 'on') { throw 'Always Use HTTPS could not be enabled. Zone Settings:Edit is required.' }
          Write-Host 'Always Use HTTPS is enabled and verified.'
