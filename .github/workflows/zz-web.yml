name: CF web check (temporary)
on:
  push:

defaults:
  run:
    shell: bash

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
      CF_WEB_HOST: ${{ secrets.CF_WEB_HOST }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
    - uses: actions/checkout@v7
    - name: Check the browser desktop through the public edge
      run: |
        HOST=$(python3 -c "
        import importlib.util
        spec = importlib.util.spec_from_file_location('cf', 'cf_tunnel.py')
        cf = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(cf)
        print(cf.resolve_route('web')[0])
        " | tail -1)
        echo "target hostname: $HOST"
        for i in $(seq 1 60); do
          body=$(curl -sS -m 10 "https://$HOST/vnc.html" 2>&1)
          if printf '%s' "$body" | grep -q "noVNC"; then
            echo "RESULT: WEB DESKTOP REACHED from another runner (noVNC page served)"
            exit 0
          fi
          echo "  attempt $i: $(printf '%s' "$body" | head -c 80)"
          sleep 5
        done
        echo "RESULT: WEB DESKTOP NOT REACHED"
        exit 1
