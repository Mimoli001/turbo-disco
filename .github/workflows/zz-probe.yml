name: CF probe (temporary)
on:
  push:

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # a bare label -> ssh.probe.<CF_DOMAIN>, so it never collides with the
      # hostname the real workflows publish
      CF_SSH_HOST: probe
    steps:
    - uses: actions/checkout@v7

    - name: Probe the Cloudflare Access API
      run: python3 probe.py

    - name: Bring up a tunnel for the probe hostname
      run: |
        python3 cf_tunnel.py setup ssh
        source /tmp/cf_tunnel.env
        echo "PROBE_HOST=$CF_SSH_HOSTNAME" >> "$GITHUB_ENV"
        curl -fsSL -o /tmp/cloudflared \
          "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
        chmod +x /tmp/cloudflared
        rm -f /tmp/cf.log
        /tmp/cloudflared tunnel run --token "$CF_TUNNEL_TOKEN" > /tmp/cf.log 2>&1 &
        READY=""
        for i in $(seq 1 40); do
          if grep -q "Registered tunnel connection" /tmp/cf.log 2>/dev/null; then READY=1; break; fi
          sleep 1
        done
        if [ -n "$READY" ]; then echo "REGISTERED=yes"; else echo "REGISTERED=no"; tail -20 /tmp/cf.log; fi

    - name: Test connectivity through the tunnel
      run: bash probe_connect.sh
