name: Windows Virtual Machine
on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v7

    - name: Download cloudflared
      run: |
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
        Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

    - name: Set RDP password
      run: |
        $admin = (Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }).Name
        echo "RDP_USER=$admin" | Out-File -FilePath $env:GITHUB_ENV -Append
        $pw = $Env:PASSWORD
        if ([string]::IsNullOrEmpty($pw)) { $pw = $Env:WINDOWS_USER_PASSWORD }
        if ([string]::IsNullOrEmpty($pw)) {
          $pw = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 12 | ForEach-Object { [char]$_ })
          Write-Host "No PASSWORD secret set - generated a random one (shown below)."
        }
        net user $admin $pw
        echo "RDP_PASSWORD=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append
      env:
        PASSWORD: ${{ secrets.PASSWORD }}
        WINDOWS_USER_PASSWORD: ${{ secrets.WINDOWS_USER_PASSWORD }}

    - name: Create Cloudflare tunnel for RDP (3389)
      run: python cf_tunnel.py setup rdp
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        CF_RDP_HOST: ${{ secrets.CF_RDP_HOST }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    - name: Start cloudflared tunnel
      run: |
        Remove-Item cf.log, cf.err -ErrorAction SilentlyContinue
        Start-Process -FilePath .\cloudflared.exe -ArgumentList 'tunnel','run','--token',$Env:CF_TUNNEL_TOKEN -RedirectStandardOutput cf.log -RedirectStandardError cf.err -WindowStyle Hidden

    - name: Print connection info
      run: |
        $ready = $null
        foreach ($i in 1..60) {
          foreach ($f in 'cf.log','cf.err') {
            if ((Test-Path $f) -and (Select-String -Path $f -Pattern 'Registered tunnel connection' -Quiet)) {
              $ready = 1
              break
            }
          }
          if ($ready) { break }
          Start-Sleep -Seconds 1
        }
        if (-not $ready) {
          Write-Host "::error::cloudflared tunnel did not register."
          Get-Content cf.err -ErrorAction SilentlyContinue | Select-Object -Last 40
          Get-Content cf.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          exit 1
        }
        Write-Host "=========================================="
        Write-Host "Tunnel is up: $Env:CF_RDP_HOSTNAME"
        Write-Host "Connect from your PC with cloudflared installed:"
        Write-Host "  cloudflared access tcp --hostname $Env:CF_RDP_HOSTNAME --url localhost:3389"
        Write-Host "  then: mstsc /v:localhost:3389"
        Write-Host "Username: $Env:RDP_USER"
        Write-Host "Password: $Env:RDP_PASSWORD"
        Write-Host "=========================================="
        Write-Host "::notice::TUNNEL_HOSTNAMES=$Env:CF_RDP_HOSTNAME"

    # TEMP: verify the published endpoint from inside the job (reverted later)
    - name: TEMP verify RDP through the tunnel
      run: |
        Write-Host "target hostname : $Env:CF_RDP_HOSTNAME"
        # Is RDP actually reachable on the address the tunnel points at?
        Write-Host "=== services ==="
        Get-Service TermService, UmRdsService -ErrorAction SilentlyContinue |
          Format-Table -AutoSize Name,Status,StartType | Out-String | Write-Host
        Write-Host "=== listeners on 3389 ==="
        $lines = @(netstat -ano | Select-String 'LISTENING' | Where-Object { $_.Line -match ':3389\s' })
        foreach ($l in $lines) { Write-Host $l.Line.Trim() }
        if (-not ($lines | Where-Object { $_.Line -match '127\.0\.0\.1:3389|0\.0\.0\.0:3389|\[::\]:3389' })) {
          Write-Host "127.0.0.1:3389 is not listening"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          try { Start-Service TermService -ErrorAction Stop } catch { Write-Host "start TermService: $($_.Exception.Message)" }
          Start-Sleep -Seconds 6
          $lines = @(netstat -ano | Select-String 'LISTENING' | Where-Object { $_.Line -match ':3389\s' })
          foreach ($l in $lines) { Write-Host "after restart: " + $l.Line.Trim() }
          $any = $lines | Select-Object -First 1
          if ($any) {
            $ip = ($any.Line.Trim() -split '\s+')[1] -replace ':3389$', ''
            if ($ip -eq '127.0.0.1' -or $ip -eq '0.0.0.0' -or $ip -eq '[::]' -or $ip -eq '::') {
              Write-Host "listener found on $ip"
            } else {
              Write-Host "RDP listens only on $ip - forwarding 127.0.0.1 -> $ip"
              netsh interface portproxy add v4tov4 listenaddress=127.0.0.1 listenport=3389 connectaddress=$ip connectport=3389 | Out-Host
            }
          } else {
            Write-Host "no RDP listener at all after restart"
          }
        }
        try {
          $probe = New-Object System.Net.Sockets.TcpClient
          $probe.Connect('127.0.0.1', 3389)
          Write-Host "local 127.0.0.1:3389 connect: OK"
          $probe.Close()
        } catch {
          Write-Host "local 127.0.0.1:3389 connect: FAILED - $($_.Exception.Message)"
        }
        Start-Process -FilePath .\cloudflared.exe -ArgumentList 'access','tcp','--hostname',$Env:CF_RDP_HOSTNAME,'--url','localhost:3390' -RedirectStandardOutput p.log -RedirectStandardError p.err -WindowStyle Hidden
        Start-Sleep -Seconds 3
        # X.224 Connection Request carrying an RDP Negotiation Request
        $payload = [byte[]](0x03,0x00,0x00,0x13,0x0e,0xe0,0x00,0x00,0x00,0x00,0x00,0x01,0x00,0x08,0x00,0x00,0x00,0x03)
        for ($i = 1; $i -le 25; $i++) {
          try {
            $c = New-Object System.Net.Sockets.TcpClient
            $c.Connect('127.0.0.1', 3390)
            $s = $c.GetStream()
            $s.Write($payload, 0, $payload.Length)
            $s.Flush()
            $buf = New-Object byte[] 64
            $n = $s.Read($buf, 0, 64)
            $c.Close()
            if ($n -ge 6 -and $buf[5] -eq 0xe0) {
              $hex = ($buf[0..($n-1)] | ForEach-Object { $_.ToString('x2') }) -join ' '
              Write-Host "RESULT: RDP HANDSHAKE SUCCEEDED"
              Write-Host "  reply: $hex"
              exit 0
            }
            Write-Host "  attempt $i : $n byte(s) back"
          } catch {
            Write-Host "  attempt $i : $($_.Exception.Message)"
          }
          Start-Sleep -Seconds 3
        }
        Write-Host "RESULT: RDP HANDSHAKE NOT RECEIVED"
        Get-Content p.err -ErrorAction SilentlyContinue | Select-Object -Last 12
        Get-Content p.log -ErrorAction SilentlyContinue | Select-Object -Last 12
        Write-Host "=== is the tunnel cloudflared still alive? ==="
        Get-Process cloudflared -ErrorAction SilentlyContinue |
          Format-Table -AutoSize Id,ProcessName,StartTime | Out-String | Write-Host
        Write-Host "=== tail of the tunnel's own log ==="
        Get-Content cf.err -ErrorAction SilentlyContinue | Select-Object -Last 20
        Get-Content cf.log -ErrorAction SilentlyContinue | Select-Object -Last 20
        Write-Host "=== what does the edge say right now? ==="
        try {
          Invoke-WebRequest -Uri "https://$Env:CF_RDP_HOSTNAME/" -TimeoutSec 10 -UseBasicParsing | Out-Null
          Write-Host "edge reply: HTTP 200 (unexpected but OK)"
        } catch {
          if ($_.Exception.Response) {
            Write-Host "edge reply: HTTP $([int]$_.Exception.Response.StatusCode)"
          } else {
            $m = $_.Exception.Message
            if ($m -match '(\d{3})') { Write-Host "edge reply: $m" } else { Write-Host "edge reply: $m" }
          }
        }
        exit 0

    - name: Keep Running Windows System and keepAlive
      run: Start-Sleep -Seconds 180   # 3 minutes (test length)
