name: Windows Virtual Machine
on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v7

    - name: Download bore
      run: |
        Invoke-WebRequest https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip -OutFile bore.zip
        Expand-Archive bore.zip -DestinationPath bore -Force

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
        Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

    - name: Set RDP password
      run: |
        $admin = (Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }).Name
        echo "RDP_USER=$admin" | Out-File -FilePath $env:GITHUB_ENV -Append
        if ([string]::IsNullOrEmpty($Env:WINDOWS_USER_PASSWORD)) {
          Write-Host "WINDOWS_USER_PASSWORD secret is not set, keeping the default password of '$admin'."
        } else {
          net user $admin $Env:WINDOWS_USER_PASSWORD
        }
      env:
        WINDOWS_USER_PASSWORD: ${{ secrets.WINDOWS_USER_PASSWORD || 'WinTest2026' }}

    - name: Start bore tunnel for RDP (3389)
      run: |
        Remove-Item bore.log, bore.err -ErrorAction SilentlyContinue
        Start-Process -FilePath .\bore\bore.exe -ArgumentList 'local','3389','--to','bore.pub' -RedirectStandardOutput bore.log -RedirectStandardError bore.err -WindowStyle Hidden

    - name: Print connection info
      run: |
        $hostport = $null
        foreach ($i in 1..30) {
          foreach ($f in 'bore.log','bore.err') {
            if (Test-Path $f) {
              $m = Select-String -Path $f -Pattern 'bore\.pub:\d+' | Select-Object -First 1
              if ($m) { $hostport = $m.Matches[0].Value; break }
            }
          }
          if ($hostport) { break }
          Start-Sleep -Seconds 1
        }
        if (-not $hostport) {
          Write-Host "::error::bore tunnel did not start."
          Get-Content bore.err -ErrorAction SilentlyContinue | Select-Object -Last 30
          Get-Content bore.log -ErrorAction SilentlyContinue | Select-Object -Last 30
          exit 1
        }
        Write-Host "=========================================="
        Write-Host "To connect: mstsc /v:$hostport"
        Write-Host "Username: $Env:RDP_USER"
        Write-Host "Password: your WINDOWS_USER_PASSWORD secret"
        Write-Host "=========================================="

    - name: Keep Running Windows System and keepAlive
      run: Start-Sleep -Seconds 300
