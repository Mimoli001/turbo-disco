name: build

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Minutes before the final checkpoint and automatic restart (maximum 330)
        required: true
        default: "320"
      save_interval_minutes:
        description: Checkpoint interval; unchanged profiles are not uploaded again
        required: true
        default: "15"
      chain:
        description: Start a fresh restored session after the final checkpoint
        required: true
        type: boolean
        default: true

concurrency:
  group: windows-persistent
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      SAVE_INTERVAL_MINUTES: ${{ inputs.save_interval_minutes }}
      CHAIN: ${{ inputs.chain }}

    steps:
    - uses: actions/checkout@v7

    - name: Preflight and job clock
      run: |
        if ([string]::IsNullOrWhiteSpace($Env:STATE_PASSPHRASE)) { throw 'STATE_PASSPHRASE secret is required.' }
        if ([string]::IsNullOrWhiteSpace($Env:GH_TOKEN)) { throw 'GH_PAT secret is required for snapshots and automatic restart.' }
        $minutes = [int]$Env:SESSION_MINUTES
        if ($minutes -lt 30 -or $minutes -gt 330) { throw 'session_minutes must be between 30 and 330.' }
        $interval = [int]$Env:SAVE_INTERVAL_MINUTES
        if ($interval -lt 5 -or $interval -gt 120) { throw 'save_interval_minutes must be between 5 and 120.' }
        "JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Append
        "SESSION_SECONDS=$($minutes * 60)" | Out-File -FilePath $env:GITHUB_ENV -Append
        "SAVE_EVERY=$($interval * 60)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Restore the latest Windows checkpoint
      timeout-minutes: 45
      run: .github/core/state.ps1 restore

    # "Prepare tool paths and free system space" (moving Julia, rtools45 and
    # Strawberry to D: and uninstalling Visual Studio) is disabled on purpose:
    # it delayed every boot by 25-50 minutes and could fail the run. Nothing
    # is moved or removed now; the session starts straight after the restore.

    - name: Prepare the portable OpenBot account session
      continue-on-error: true
      run: .github/core/helper.ps1 rebind

    - name: Restore GitHub CLI account and Git credentials
      run: |
        $token = gh auth token
        if ([string]::IsNullOrWhiteSpace($token)) { throw 'No valid GitHub token is available from GH_PAT.' }
        $savedToken = $env:GH_TOKEN
        try {
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          $token | gh auth login -h github.com --with-token
          gh auth setup-git
        } finally {
          if ($savedToken) { $env:GH_TOKEN = $savedToken }
          Remove-Variable token, savedToken -ErrorAction SilentlyContinue
        }

    - name: Download cloudflared
      run: Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
        Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

    - name: Set RDP password
      run: |
        $admin = (Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }).Name
        "RDP_USER=$admin" | Out-File -FilePath $env:GITHUB_ENV -Append
        $pw = $Env:PASSWORD
        if ([string]::IsNullOrEmpty($pw)) { $pw = $Env:WINDOWS_USER_PASSWORD }
        if ([string]::IsNullOrEmpty($pw)) {
          $pw = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 12 | ForEach-Object { [char]$_ })
          Write-Host 'No PASSWORD secret set - generated a random one (shown below).'
        }
        net user $admin $pw
        "RDP_PASSWORD=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append
      env:
        PASSWORD: ${{ secrets.PASSWORD }}
        WINDOWS_USER_PASSWORD: ${{ secrets.WINDOWS_USER_PASSWORD }}

    - name: Install TightVNC server for the browser desktop
      run: |
        $pw = $Env:RDP_PASSWORD
        $vncPw = $pw.Substring(0, [Math]::Min(8, $pw.Length))
        "VNC_PASSWORD=$vncPw" | Out-File -FilePath $env:GITHUB_ENV -Append
        Invoke-WebRequest https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi -OutFile tvnc.msi
        $msi = Start-Process msiexec -ArgumentList '/i','tvnc.msi','/quiet','/norestart',
          'ADDLOCAL=Server','SERVER_REGISTER_AS_SYSTEM=1',
          'SERVER_ADD_FIREWALL_EXCEPTION=1','SERVER_ALLOW_LOOPBACK=1',
          'SET_PASSWORD=1',"VALUE_OF_PASSWORD=$vncPw" -Wait -PassThru
        if ($msi.ExitCode -ne 0) {
          Write-Host "::warning::TightVNC installer exited with $($msi.ExitCode) - browser desktop may be unavailable."
        }
        try {
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\TightVNC\Server' -Name 'AllowLoopback' -Value 1 -Type DWord -ErrorAction Stop
        } catch {
          New-Item -Path 'HKLM:\SOFTWARE\TightVNC\Server' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\TightVNC\Server' -Name 'AllowLoopback' -Value 1 -PropertyType DWord -Force | Out-Null
        }
        try { Restart-Service tvnserver -ErrorAction Stop } catch { Start-Service tvnserver -ErrorAction Stop }
        Start-Sleep -Seconds 3

    - name: Create Cloudflare tunnel for RDP and browser desktop
      run: python runtime.py setup rdp web
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        CF_RDP_HOST: ${{ secrets.CF_RDP_HOST }}
        CF_WEB_HOST: ${{ secrets.CF_WEB_HOST }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    # The tunnel, browser bridge, OpenBot and the save loop deliberately share
    # one step. Processes started in an earlier step do not survive on Windows.
    - name: Start services and run the persistent session
      id: hold
      run: |
        Remove-Item cf.log, cf.err -ErrorAction SilentlyContinue
        Start-Process -FilePath .\cloudflared.exe -ArgumentList 'tunnel','run','--token',$Env:CF_TUNNEL_TOKEN -RedirectStandardOutput cf.log -RedirectStandardError cf.err -WindowStyle Hidden

        python -m pip install --quiet --disable-pip-version-check websockify
        Invoke-WebRequest https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.tar.gz -OutFile novnc.tgz
        tar -xzf novnc.tgz
        Remove-Item novnc.log, novnc.err -ErrorAction SilentlyContinue
        Start-Process -FilePath python -ArgumentList '-m','websockify','--web','noVNC-1.7.0','6080','localhost:5900' -RedirectStandardOutput novnc.log -RedirectStandardError novnc.err -WindowStyle Hidden

        $openbot = Join-Path $env:LOCALAPPDATA 'Programs\OpenBot\OpenBot.exe'
        $accountLog = Join-Path $env:APPDATA 'OpenBot\logs\account\account.log'
        $accountLogOffset = if (Test-Path -LiteralPath $accountLog) { @(Get-Content -LiteralPath $accountLog).Count } else { 0 }
        if ((Test-Path -LiteralPath $openbot) -and -not (Get-Process OpenBot -ErrorAction SilentlyContinue)) {
          Start-Process -FilePath $openbot
        }
        Start-Sleep -Seconds 15
        $openbotRunning = [bool](Get-Process OpenBot -ErrorAction SilentlyContinue)
        Write-Host "OpenBot process running: $openbotRunning"
        $openbotAuth = Join-Path $env:APPDATA 'OpenBot\openbot-central-auth-v1.bin'
        $openbotKey = Join-Path $env:APPDATA 'OpenBot\secret-storage.key'
        if (Test-Path -LiteralPath $openbotAuth) {
          $authBytes = [Convert]::FromBase64String([IO.File]::ReadAllText($openbotAuth).Trim())
          $authFormat = [Text.Encoding]::ASCII.GetString($authBytes[0..2])
          Write-Host "OpenBot session format: $authFormat; portable key present: $(Test-Path -LiteralPath $openbotKey)"
        }
        if (Test-Path -LiteralPath $accountLog) {
          $newAccountLines = @(Get-Content -LiteralPath $accountLog | Select-Object -Skip $accountLogOffset)
          $accountErrors = @($newAccountLines | Select-String -Pattern 'could not be restored|unauthorized|sign in is required' -CaseSensitive:$false)
          if ($accountErrors.Count -gt 0) {
            Write-Host "::warning::OpenBot reported an account-session problem during this startup: $($accountErrors -join ' | ')"
          } else {
            Write-Host 'OpenBot startup reported no new decrypt or authorization errors.'
          }
        }

        $startupFolder = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup'
        New-Item -ItemType Directory -Path $startupFolder -Force | Out-Null
        $routerVbs = @(
          'Set WshShell = CreateObject("WScript.Shell")'
          'WshShell.Run """C:\Program Files\PowerShell\7\pwsh.exe"" -NoLogo -NoExit -Command ""9router --no-browser --skip-update""", 1, False'
        ) -join [Environment]::NewLine
        Set-Content -LiteralPath (Join-Path $startupFolder '9router.vbs') -Value $routerVbs -Encoding ascii
        $routerTerminal = Get-CimInstance Win32_Process | Where-Object {
          $_.Name -match '^pwsh(\.exe)?$' -and $_.CommandLine -match 'NoExit.+9router'
        }
        if (-not $routerTerminal) {
          Get-CimInstance Win32_Process | Where-Object {
            $_.CommandLine -match '9router[\\/]+(cli\.js|app[\\/]+custom-server\.js|src[\\/]+cli[\\/]+tray)'
          } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          Start-Process -FilePath 'pwsh' -ArgumentList '-NoLogo','-NoExit','-Command','9router --no-browser --skip-update' -WindowStyle Normal
          Start-Sleep -Seconds 10
        }
        $routerListening = [bool](Get-NetTCPConnection -LocalPort 20128 -State Listen -ErrorAction SilentlyContinue)
        Write-Host "9router terminal startup: port 20128 listening=$routerListening"

        $ready = $null
        foreach ($i in 1..60) {
          foreach ($f in 'cf.log','cf.err') {
            if ((Test-Path $f) -and (Select-String -Path $f -Pattern 'Registered tunnel connection' -Quiet)) {
              $ready = 1
              break
            }
          }
          if ($ready) { break }
          Start-Sleep -Seconds 1
        }
        if (-not $ready) {
          Write-Host '::error::cloudflared tunnel did not register.'
          Get-Content cf.err -ErrorAction SilentlyContinue | Select-Object -Last 40
          Get-Content cf.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          exit 1
        }

        $vncUp = @(netstat -ano | Select-String 'LISTENING' | Where-Object { $_.Line -match ':5900\s' }).Count -gt 0
        Write-Host "local 5900 (VNC) listening: $vncUp"
        try {
          $page = Invoke-WebRequest -Uri 'http://127.0.0.1:6080/vnc.html' -TimeoutSec 15 -UseBasicParsing
          Write-Host "local noVNC page: HTTP $($page.StatusCode), has client: $($page.Content -match 'noVNC')"
        } catch {
          Write-Host "local noVNC page FAILED: $($_.Exception.Message)"
          Get-Content novnc.err -ErrorAction SilentlyContinue | Select-Object -Last 15
        }
        try {
          $t = New-Object System.Net.Sockets.TcpClient
          $t.ReceiveTimeout = 5000
          $t.Connect('127.0.0.1', 5900)
          $s = $t.GetStream()
          $s.ReadTimeout = 5000
          $banner = New-Object byte[] 12
          $n = $s.Read($banner, 0, 12)
          $s.Write($banner, 0, $n)
          $s.Flush()
          $sec = New-Object byte[] 16
          $m = $s.Read($sec, 0, 16)
          $t.Close()
          $types = ($sec[1..($m-1)] | ForEach-Object { $_.ToString() }) -join ','
          Write-Host "VNC banner: $([Text.Encoding]::ASCII.GetString($banner).Trim()) / auth types: [$types] (2=VNC password)"
        } catch {
          Write-Host "VNC auth probe FAILED: $($_.Exception.Message)"
        }
        try {
          $rdp = New-Object System.Net.Sockets.TcpClient
          $rdp.ReceiveTimeout = 5000
          $rdp.Connect('127.0.0.1', 3389)
          $rs = $rdp.GetStream()
          $rs.ReadTimeout = 5000
          $request = [Convert]::FromHexString('030000130ee000000000000100080003000000')
          $rs.Write($request, 0, $request.Length)
          $response = New-Object byte[] 19
          $count = $rs.Read($response, 0, $response.Length)
          $rdp.Close()
          if ($count -lt 6 -or $response[5] -ne 0xd0) { throw 'Invalid X.224 Connection Confirm.' }
          Write-Host 'RDP protocol check: valid X.224 Connection Confirm.'
        } catch {
          Write-Host "RDP protocol probe FAILED: $($_.Exception.Message)"
        }
        try {
          $public = Invoke-WebRequest -Uri "https://$Env:CF_WEB_HOSTNAME/vnc.html" -TimeoutSec 20 -UseBasicParsing
          Write-Host "public noVNC page: HTTP $($public.StatusCode)"
        } catch {
          Write-Host "public noVNC check FAILED: $($_.Exception.Message)"
        }

        Write-Host '=========================================='
        Write-Host "Tunnel is up: $Env:CF_RDP_HOSTNAME and $Env:CF_WEB_HOSTNAME"
        Write-Host 'Native Remote Desktop (cloudflared on your PC):'
        Write-Host "  cloudflared access tcp --hostname $Env:CF_RDP_HOSTNAME --url localhost:3389"
        Write-Host '  then: mstsc /v:localhost:3389'
        Write-Host "Username: $Env:RDP_USER"
        Write-Host "Password: $Env:RDP_PASSWORD"
        Write-Host 'Browser desktop (any device, nothing to install):'
        Write-Host "  open https://$Env:CF_WEB_HOSTNAME/vnc.html"
        Write-Host "  VNC password: $Env:VNC_PASSWORD"
        Write-Host '=========================================='
        Write-Host "::notice::TUNNEL_HOSTNAMES=$Env:CF_RDP_HOSTNAME,$Env:CF_WEB_HOSTNAME"

        & .github/core/state.ps1 hold

    - name: Final checkpoint after cancellation or an interrupted hold
      id: final
      if: always() && steps.hold.outputs.saved != 'true'
      timeout-minutes: 20
      run: .github/core/state.ps1 final

    - name: Continue in a fresh restored run
      if: always() && !cancelled() && env.CHAIN == 'true' && (steps.hold.outputs.chain == 'true' || steps.final.outputs.chain == 'true')
      run: gh workflow run windows.yml -R "$env:GITHUB_REPOSITORY" --ref "$env:GITHUB_REF_NAME" -F session_minutes="$env:SESSION_MINUTES" -F save_interval_minutes="$env:SAVE_INTERVAL_MINUTES" -F chain=true
