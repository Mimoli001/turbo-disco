name: Windows Virtual Machine
on:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v7

    - name: Download cloudflared
      run: |
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
        Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

    - name: Set RDP password
      run: |
        $admin = (Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }).Name
        echo "RDP_USER=$admin" | Out-File -FilePath $env:GITHUB_ENV -Append
        if ([string]::IsNullOrEmpty($Env:WINDOWS_USER_PASSWORD)) {
          Write-Host "WINDOWS_USER_PASSWORD secret is not set, keeping the default password of '$admin'."
        } else {
          net user $admin $Env:WINDOWS_USER_PASSWORD
        }
      env:
        WINDOWS_USER_PASSWORD: ${{ secrets.WINDOWS_USER_PASSWORD }}

    - name: Create Cloudflare tunnel for RDP (3389)
      run: python cf_tunnel.py setup rdp
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        CF_SUBDOMAIN: ${{ secrets.CF_SUBDOMAIN }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    - name: Start cloudflared tunnel
      run: |
        Remove-Item cf.log, cf.err -ErrorAction SilentlyContinue
        Start-Process -FilePath .\cloudflared.exe -ArgumentList 'tunnel','run','--token',$Env:CF_TUNNEL_TOKEN -RedirectStandardOutput cf.log -RedirectStandardError cf.err -WindowStyle Hidden

    - name: Print connection info
      run: |
        $ready = $null
        foreach ($i in 1..60) {
          foreach ($f in 'cf.log','cf.err') {
            if ((Test-Path $f) -and (Select-String -Path $f -Pattern 'Registered tunnel connection' -Quiet)) {
              $ready = 1
              break
            }
          }
          if ($ready) { break }
          Start-Sleep -Seconds 1
        }
        if (-not $ready) {
          Write-Host "::error::cloudflared tunnel did not register."
          Get-Content cf.err -ErrorAction SilentlyContinue | Select-Object -Last 40
          Get-Content cf.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          exit 1
        }
        Write-Host "=========================================="
        Write-Host "Tunnel is up: $Env:CF_RDP_HOSTNAME"
        Write-Host "Connect from your PC with cloudflared installed:"
        Write-Host "  cloudflared access tcp --hostname $Env:CF_RDP_HOSTNAME --url localhost:3389"
        Write-Host "  then: mstsc /v:localhost:3389"
        Write-Host "Username: $Env:RDP_USER"
        Write-Host "Password: your WINDOWS_USER_PASSWORD secret"
        Write-Host "=========================================="
        Write-Host "::notice::TUNNEL_HOSTNAMES=$Env:CF_RDP_HOSTNAME"

    - name: Keep Running Windows System and keepAlive
      run: Start-Sleep -Seconds 21600
