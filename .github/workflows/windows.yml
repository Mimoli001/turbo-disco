name: Windows Virtual Machine
on:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v7

    - name: Download cloudflared
      run: |
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
        Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

    - name: Set RDP password
      run: |
        $admin = (Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }).Name
        echo "RDP_USER=$admin" | Out-File -FilePath $env:GITHUB_ENV -Append
        $pw = $Env:PASSWORD
        if ([string]::IsNullOrEmpty($pw)) { $pw = $Env:WINDOWS_USER_PASSWORD }
        if ([string]::IsNullOrEmpty($pw)) {
          $pw = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 12 | ForEach-Object { [char]$_ })
          Write-Host "No PASSWORD secret set - generated a random one (shown below)."
        }
        net user $admin $pw
        echo "RDP_PASSWORD=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append
      env:
        PASSWORD: ${{ secrets.PASSWORD }}
        WINDOWS_USER_PASSWORD: ${{ secrets.WINDOWS_USER_PASSWORD }}

    - name: Install TightVNC server (for the browser desktop)
      run: |
        $pw = $Env:RDP_PASSWORD
        # Classic VNC auth accepts at most 8 characters - same convention as
        # the Linux desktop (first 8 of the machine password).
        $vncPw = $pw.Substring(0, [Math]::Min(8, $pw.Length))
        echo "VNC_PASSWORD=$vncPw" | Out-File -FilePath $env:GITHUB_ENV -Append
        Invoke-WebRequest https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi -OutFile tvnc.msi
        $msi = Start-Process msiexec -ArgumentList '/i','tvnc.msi','/quiet','/norestart',
          'ADDLOCAL=Server','SERVER_REGISTER_AS_SYSTEM=1',
          'SERVER_ADD_FIREWALL_EXCEPTION=1','SERVER_ALLOW_LOOPBACK=1',
          'SET_PASSWORD=1',"VALUE_OF_PASSWORD=$vncPw" -Wait -PassThru
        if ($msi.ExitCode -ne 0) {
          Write-Host "::warning::TightVNC installer exited with $($msi.ExitCode) - browser desktop may be unavailable."
        }
        # The tunnel and the noVNC bridge both reach VNC over loopback, which
        # TightVNC blocks by default - enforce it in the registry too, then
        # (re)start the service so the setting takes effect.
        try {
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\TightVNC\Server' -Name 'AllowLoopback' -Value 1 -Type DWord -ErrorAction Stop
        } catch {
          try {
            New-Item -Path 'HKLM:\SOFTWARE\TightVNC\Server' -Force | Out-Null
            New-ItemProperty -Path 'HKLM:\SOFTWARE\TightVNC\Server' -Name 'AllowLoopback' -Value 1 -PropertyType DWord -Force | Out-Null
          } catch { Write-Host "AllowLoopback registry: $($_.Exception.Message)" }
        }
        try { Restart-Service tvnserver -ErrorAction Stop } catch { try { Start-Service tvnserver -ErrorAction Stop } catch { Write-Host "start tvnserver: $($_.Exception.Message)" } }
        Start-Sleep -Seconds 3

    - name: Create Cloudflare tunnel for RDP (3389) and browser desktop
      run: python cf_tunnel.py setup rdp web
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        CF_RDP_HOST: ${{ secrets.CF_RDP_HOST }}
        CF_WEB_HOST: ${{ secrets.CF_WEB_HOST }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}


    # Starting the tunnel, the browser bridge, printing the connection info
    # and keeping the machine alive happen inside ONE step on purpose:
    # a process launched by Start-Process in its own step is already gone by
    # the time the next step runs, so the tunnel would die seconds after
    # "Tunnel is up".
    - name: Start the tunnel and keep Windows alive
      run: |
        Remove-Item cf.log, cf.err -ErrorAction SilentlyContinue
        Start-Process -FilePath .\cloudflared.exe -ArgumentList 'tunnel','run','--token',$Env:CF_TUNNEL_TOKEN -RedirectStandardOutput cf.log -RedirectStandardError cf.err -WindowStyle Hidden

        # noVNC bridge: browser (https via the tunnel) -> websockify -> VNC.
        # Must start here, not in an earlier step (see the note above).
        # NOTE: utils/novnc_proxy is a bash script, so on Windows run the
        # websockify module directly with --web pointing at the noVNC files.
        python -m pip install --quiet --disable-pip-version-check websockify
        Invoke-WebRequest https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.tar.gz -OutFile novnc.tgz
        tar -xzf novnc.tgz
        Remove-Item novnc.log, novnc.err -ErrorAction SilentlyContinue
        Start-Process -FilePath python -ArgumentList '-m','websockify','--web','noVNC-1.7.0','6080','localhost:5900' -RedirectStandardOutput novnc.log -RedirectStandardError novnc.err -WindowStyle Hidden

        $ready = $null
        foreach ($i in 1..60) {
          foreach ($f in 'cf.log','cf.err') {
            if ((Test-Path $f) -and (Select-String -Path $f -Pattern 'Registered tunnel connection' -Quiet)) {
              $ready = 1
              break
            }
          }
          if ($ready) { break }
          Start-Sleep -Seconds 1
        }
        if (-not $ready) {
          Write-Host "::error::cloudflared tunnel did not register."
          Get-Content cf.err -ErrorAction SilentlyContinue | Select-Object -Last 40
          Get-Content cf.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          exit 1
        }

        # Local checks: VNC server up, noVNC bridge serving, VNC auth offered.        $vncUp = @(netstat -ano | Select-String 'LISTENING' | Where-Object { $_.Line -match ':5900\s' }).Count -gt 0
        Write-Host "local 5900 (VNC) listening: $vncUp"
        try {
          $page = Invoke-WebRequest -Uri 'http://127.0.0.1:6080/vnc.html' -TimeoutSec 15 -UseBasicParsing
          Write-Host "local noVNC page: HTTP $($page.StatusCode), has client: $($page.Content -match 'noVNC')"
        } catch {
          Write-Host "local noVNC page FAILED: $($_.Exception.Message)"
          Write-Host "--- novnc.err ---"
          Get-Content novnc.err -ErrorAction SilentlyContinue | Select-Object -Last 15
          Write-Host "--- novnc.log ---"
          Get-Content novnc.log -ErrorAction SilentlyContinue | Select-Object -Last 8
        }
        try {
          $t = New-Object System.Net.Sockets.TcpClient
          $t.ReceiveTimeout = 5000
          $t.Connect('127.0.0.1', 5900)
          $s = $t.GetStream()
          $banner = New-Object byte[] 12
          $n = $s.Read($banner, 0, 12)
          $s.Write($banner, 0, $n)
          $s.Flush()
          $sec = New-Object byte[] 16
          $m = $s.Read($sec, 0, 16)
          $t.Close()
          $types = ($sec[1..($m-1)] | ForEach-Object { $_.ToString() }) -join ','
          Write-Host "VNC banner: $([Text.Encoding]::ASCII.GetString($banner).Trim()) / auth types: [$types] (2=VNC password)"
        } catch {
          Write-Host "VNC auth probe FAILED: $($_.Exception.Message)"
        }

        Write-Host "=========================================="
        Write-Host "Tunnel is up: $Env:CF_RDP_HOSTNAME and $Env:CF_WEB_HOSTNAME"
        Write-Host "Native Remote Desktop (cloudflared on your PC):"
        Write-Host "  cloudflared access tcp --hostname $Env:CF_RDP_HOSTNAME --url localhost:3389"
        Write-Host "  then: mstsc /v:localhost:3389"
        Write-Host "Username: $Env:RDP_USER"
        Write-Host "Password: $Env:RDP_PASSWORD"
        Write-Host "Browser desktop (any device, nothing to install):"
        Write-Host "  open https://$Env:CF_WEB_HOSTNAME/vnc.html"
        Write-Host "  VNC password: $Env:VNC_PASSWORD"
        Write-Host "=========================================="
        Write-Host "::notice::TUNNEL_HOSTNAMES=$Env:CF_RDP_HOSTNAME,$Env:CF_WEB_HOSTNAME"

        Start-Sleep -Seconds 21600
