name: CF diagnostic (temporary)
on:
  push:

defaults:
  run:
    shell: bash

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
    - uses: actions/checkout@v7
    - name: Dump DNS records and tunnels
      # let the Windows run reach its keep-alive so its tunnel state has settled
      run: |
        sleep 150
        python3 zz_diag.py
