name: _probe
on:
  push:
  workflow_dispatch:

jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Runner is alive
        run: echo "hello from runner $(uname -a)"
      - name: Probe whether GITHUB_TOKEN can manage secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh secret set PROBE_TEST --repo "$GITHUB_REPOSITORY" <<< "x"; then
            echo "RESULT: secrets-writable=YES"
            gh secret delete PROBE_TEST --repo "$GITHUB_REPOSITORY" || true
          else
            echo "RESULT: secrets-writable=NO"
          fi
