name: MacOS Virtual Machine
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: MacOS Build
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
    - name: Setting Up the MacOS Environment
      env:
        PASSWORD: ${{ secrets.PASSWORD }}
        MAC_REALNAME: ${{ secrets.MAC_REALNAME }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        CF_VNC_HOST: ${{ secrets.CF_VNC_HOST }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      run: source macos-run.sh
    - name: Connecting MacOS with Cloudflare Tunnel to VNC Server
      run: |
        if ! grep -q "Registered tunnel connection" /tmp/cloudflared.log 2>/dev/null; then
          echo "::error::cloudflared tunnel did not register."
          cat /tmp/cloudflared.log 2>/dev/null
          exit 1
        fi
        echo "VNC connect: cloudflared access tcp --hostname $CF_VNC_HOSTNAME --url localhost:5900"
        echo "::notice::TUNNEL_HOSTNAMES=$CF_VNC_HOSTNAME"
    - name: Keep Running MacOS System and keepAlive
      run: sleep 6h
