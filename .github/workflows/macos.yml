name: MacOS Virtual Machine
on:
  push:
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  build:
    name: MacOS Build
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setting Up the MacOS Environment
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        MAC_USER_PASSWORD: ${{ secrets.MAC_USER_PASSWORD || 'MacTest2026' }}
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD || 'VncTest2026' }}
        MAC_REALNAME: ${{ secrets.MAC_REALNAME || 'Test User' }}
      run: source macos-run.sh "$MAC_USER_PASSWORD" "$VNC_PASSWORD" "$NGROK_AUTH_TOKEN" "$MAC_REALNAME"
    - name: Connecting MacOS with Ngrok to VNC Server
      run: |
        URL=$(curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url // empty')
        if [[ -z "$URL" ]]; then
          echo "::error::ngrok tunnel did not start. Check NGROK_AUTH_TOKEN, or verify your free ngrok account (TCP tunnels require credit card verification)."
          exit 1
        fi
        echo "VNC connect address (without tcp://): ${URL#tcp://}"
    - name: Keep Running MacOS System and keepAlive
      run: sleep 300
