name: MacOS Virtual Machine
on:
  push:
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  build:
    name: MacOS Build
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setting Up the MacOS Environment
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        MAC_USER_PASSWORD: ${{ secrets.MAC_USER_PASSWORD || 'MacTest2026' }}
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD || 'VncTest2026' }}
        MAC_REALNAME: ${{ secrets.MAC_REALNAME || 'Test User' }}
      run: source macos-run.sh "$MAC_USER_PASSWORD" "$VNC_PASSWORD" "$NGROK_AUTH_TOKEN" "$MAC_REALNAME"
    - name: Connecting MacOS with bore to VNC Server
      run: |
        HOSTPORT=""
        for i in $(seq 1 30); do
          HOSTPORT=$(grep -oE 'bore\.pub:[0-9]+' /tmp/bore.log 2>/dev/null | head -n1)
          if [[ -n "$HOSTPORT" ]]; then
            break
          fi
          sleep 1
        done
        if [[ -z "$HOSTPORT" ]]; then
          echo "::error::bore tunnel did not start."
          cat /tmp/bore.log 2>/dev/null
          exit 1
        fi
        echo "VNC connect address: $HOSTPORT"
    - name: Keep Running MacOS System and keepAlive
      run: sleep 300
