name: CF e2e test (temporary)
on:
  push:

defaults:
  run:
    shell: bash

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
    - uses: actions/checkout@v7
    - name: Install the client tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq sshpass
        curl -fsSL -o /usr/local/bin/cloudflared \
          "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
        chmod +x /usr/local/bin/cloudflared
    - name: Connect to the SSH machine
      env:
        WAIT_FOR_TUNNEL: "8"
      run: bash e2e_test.sh ssh 30

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
    - uses: actions/checkout@v7
    - name: Install the client tools
      run: |
        curl -fsSL -o /usr/local/bin/cloudflared \
          "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
        chmod +x /usr/local/bin/cloudflared
    - name: Connect to the desktop (VNC)
      env:
        WAIT_FOR_TUNNEL: "75"
      run: bash e2e_test.sh desktop 30

  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
    - uses: actions/checkout@v7
    - name: Install the client tools
      run: |
        curl -fsSL -o /usr/local/bin/cloudflared \
          "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
        chmod +x /usr/local/bin/cloudflared
    - name: Connect to the Windows machine (RDP)
      env:
        # the 1033-readiness probe is unreliable for tcp:// origins (the edge
        # answers 1033/502/200 interchangeably), so do not waste the server's
        # lifetime on it - go straight to real protocol attempts instead
        WAIT_FOR_TUNNEL: "3"
      run: bash e2e_test.sh rdp 100
