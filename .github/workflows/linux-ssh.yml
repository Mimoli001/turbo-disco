name: Ubuntu ssh Virtual Machine
on:
  push:
  workflow_dispatch:
defaults:
  run:
    shell: bash


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Preparing Linux Environment
      run: sudo apt-get update
    - name: Setting Up the Ubuntu Environment
      run: bash linux-ssh.sh
      env:
        LINUX_USER_PASSWORD: ${{ secrets.LINUX_USER_PASSWORD || 'TestPass2026' }}
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        CHROME_HEADLESS_CODE: ${{ secrets.CHROME_HEADLESS_CODE }}
        LINUX_MACHINE_NAME: ${{ secrets.LINUX_MACHINE_NAME || 'freevps-test' }}
        LINUX_USERNAME: ${{ secrets.LINUX_USERNAME || 'tester' }}
    - name: Keep Running Ubuntu System and keepAlive
      run: sleep 300
