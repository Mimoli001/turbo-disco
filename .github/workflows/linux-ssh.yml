name: Ubuntu ssh Virtual Machine
on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
    - name: Preparing Linux Environment
      run: sudo apt-get update
    - name: Setting Up the Ubuntu Environment
      run: bash linux-ssh.sh
      env:
        PASSWORD: ${{ secrets.PASSWORD }}
        LINUX_MACHINE_NAME: ${{ secrets.LINUX_MACHINE_NAME }}
        LINUX_USERNAME: ${{ secrets.LINUX_USERNAME }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        CF_SSH_HOST: ${{ secrets.CF_SSH_HOST }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    # TEMP: verify the published endpoint from inside the job (reverted later)
    - name: TEMP verify SSH through the tunnel
      env:
        PASSWORD: ${{ secrets.PASSWORD }}
        WAIT_FOR_TUNNEL: "15"
      run: PATH=/tmp:$PATH bash e2e_test.sh ssh 25 "$CF_SSH_HOSTNAME"
    - name: Keep Running Ubuntu System and keepAlive
      run: sleep 180   # 3 minutes (test length)
