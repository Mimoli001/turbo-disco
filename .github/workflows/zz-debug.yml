name: CF debug (temporary)
on:
  push:

defaults:
  run:
    shell: bash

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: Cloudflare diagnostics
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      run: |
        python3 - <<'PY'
        import os, json, urllib.request, urllib.error

        API = "https://api.cloudflare.com/client/v4"
        tok = os.environ.get("CF_API_TOKEN", "")

        def get(path):
            r = urllib.request.Request(API + path, headers={
                "Authorization": "Bearer " + tok, "Content-Type": "application/json"})
            try:
                with urllib.request.urlopen(r, timeout=30) as resp:
                    return resp.status, json.loads(resp.read() or b"{}")
            except urllib.error.HTTPError as e:
                try:
                    return e.code, json.loads(e.read() or b"{}")
                except Exception:
                    return e.code, {}
            except Exception as e:
                return 0, {"exc": repr(e)}

        def show(label, path):
            s, p = get(path)
            n = len(p.get("data") or []) if isinstance(p.get("data"), list) else p.get("data")
            print(f"{label}\n   http={s} data={n} errors="
                  f"{[(x.get('code'), x.get('message')) for x in (p.get('errors') or [])]}")
            return s, p

        dom = os.environ.get("CF_DOMAIN", "")
        acct = os.environ.get("CF_ACCOUNT_ID", "")
        print("CF_DOMAIN:", repr(dom), " CF_ACCOUNT_ID set:", bool(acct))

        s, v = get("/user/tokens/verify")
        print("token verify -> http=%s id=%s status=%s errors=%s" % (
            s, (v.get("result") or {}).get("id"),
            (v.get("result") or {}).get("status"),
            [(x.get("code"), x.get("message")) for x in (v.get("errors") or [])]))

        show("GET /accounts?per_page=50", "/accounts?per_page=50")
        if acct:
            show("GET /accounts/" + acct, "/accounts/" + acct)
            show("GET /zones?account.id=" + acct, "/zones?account.id=" + acct + "&per_page=50")
            show("GET cfd_tunnel list", f"/accounts/{acct}/cfd_tunnel?is_deleted=false&per_page=10")
        tld = dom.split(".")[-1] if dom else ""
        if tld:
            show("GET /zones?name=" + dom, "/zones?name=" + dom)
        print("== done ==")
        PY
