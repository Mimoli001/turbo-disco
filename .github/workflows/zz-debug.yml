name: CF debug (temporary)
on:
  push:

defaults:
  run:
    shell: bash

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: Cloudflare diagnostics
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      run: |
        python3 - <<'PY'
        import os, json, urllib.request, urllib.error

        API = "https://api.cloudflare.com/client/v4"
        tok = os.environ.get("CF_API_TOKEN", "")

        def get(path):
            r = urllib.request.Request(API + path, headers={
                "Authorization": "Bearer " + tok, "Content-Type": "application/json"})
            try:
                with urllib.request.urlopen(r, timeout=30) as resp:
                    return resp.status, json.loads(resp.read() or b"{}")
            except urllib.error.HTTPError as e:
                try:
                    return e.code, json.loads(e.read() or b"{}")
                except Exception:
                    return e.code, {}
            except Exception as e:
                return 0, {"exc": repr(e)}

        def raw(label, path):
            s, p = get(path)
            body = json.dumps(p)
            print(f"{label} http={s}\n   {body[:400]}")

        dom = os.environ.get("CF_DOMAIN", "")
        acct = os.environ.get("CF_ACCOUNT_ID", "")
        print("CF_DOMAIN set:", bool(dom), "len:", len(dom),
              " CF_ACCOUNT_ID set:", bool(acct), "len:", len(acct))
        print("token prefix:", tok[:6], " token len:", len(tok),
              " has whitespace:", tok != tok.strip())

        raw("verify ", "/user/tokens/verify")
        raw("accounts", "/accounts?per_page=50")
        raw("zones ", "/zones?per_page=50")
        print("== done ==")
        PY
