name: CF debug (temporary)
on:
  push:

defaults:
  run:
    shell: bash

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: Cloudflare diagnostics
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_SSH_HOST: ${{ secrets.CF_SSH_HOST }}
        CF_DESKTOP_HOST: ${{ secrets.CF_DESKTOP_HOST }}
        CF_RDP_HOST: ${{ secrets.CF_RDP_HOST }}
        CF_VNC_HOST: ${{ secrets.CF_VNC_HOST }}
      run: |
        python3 - <<'PY'
        import os, json, urllib.request, urllib.error

        API = "https://api.cloudflare.com/client/v4"
        tok = os.environ.get("CF_API_TOKEN", "")

        def get(path):
            r = urllib.request.Request(API + path, headers={
                "Authorization": "Bearer " + tok, "Content-Type": "application/json"})
            try:
                with urllib.request.urlopen(r, timeout=30) as resp:
                    return resp.status, json.loads(resp.read() or b"{}")
            except urllib.error.HTTPError as e:
                try:
                    return e.code, json.loads(e.read() or b"{}")
                except Exception:
                    return e.code, {}
            except Exception as e:
                return 0, {"exc": repr(e)}

        def err(p):
            return [(x.get("code"), x.get("message")) for x in (p.get("errors") or [])]

        dom = os.environ.get("CF_DOMAIN", "")
        print("== CF_DOMAIN shape ==")
        print("  present:", bool(dom), " length:", len(dom))
        print("  contains '/' or space:", ("/" in dom) or (" " in dom))
        print("  startswith http:", dom.lower().startswith("http"))
        print("  dot count:", dom.count("."), " TLD:", dom.split(".")[-1] if dom else "-")
        for v in ("CF_ACCOUNT_ID", "CF_SSH_HOST", "CF_DESKTOP_HOST", "CF_RDP_HOST", "CF_VNC_HOST"):
            print(f"  {v} present:", bool(os.environ.get(v, "")))

        s, a = get("/accounts?per_page=50")
        print("== GET /accounts ->", s, "==")
        for x in (a.get("data") or []):
            print("   id:", x.get("id"), " name:", x.get("name"))
        print("   errors:", err(a))

        s, z = get("/zones?per_page=50&status=active")
        print("== GET /zones?status=active ->", s, "==")
        for x in (z.get("data") or []):
            print("   name:", x.get("name"), " id:", x.get("id"),
                  " account:", (x.get("account") or {}).get("id"))
        print("   errors:", err(z))

        s, z2 = get("/zones?per_page=50")
        print("== GET /zones (no status filter) ->", s, "==")
        for x in (z2.get("data") or []):
            print("   name:", x.get("name"), " status:", x.get("status"))
        print("   errors:", err(z2))

        acct = os.environ.get("CF_ACCOUNT_ID") or (
            (a.get("data") or [{"id": None}])[0].get("id"))
        if acct:
            s, idp = get(f"/accounts/{acct}/access/identity_providers")
            print("== identity_providers ->", s, " count:",
                  len(idp.get("data") or []), "==")
            print("   errors:", err(idp))
        print("== done ==")
        PY
